<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loonatic Tunes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-primary: #000000;
        --bg-secondary: #0d0d0d;
        --bg-elevated: #161616;
        --text-primary: #e0e0e0;
        --text-secondary: #aaaaaa;
        --text-tertiary: #888888;
        --border-primary: #1e1e1e;
        --accent-primary: #b658ff;
        --accent-dim: #5c1280;
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.7);
        --player-height: 88px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        margin: 0;
        padding: 0 0 var(--player-height) 0;
    }

    a { color: inherit; text-decoration: none; }

    .navbar {
        background: #000;
        padding: 22px 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        border-bottom: 1px solid var(--border-primary);
    }

    .navbar-back {
        font-size: 0.85em;
        color: var(--text-tertiary);
        transition: color 0.2s;
    }
    .navbar-back:hover { color: var(--text-primary); }

    .navbar-title {
        font-size: 1.3em;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #d9a3ff 0%, var(--accent-primary) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2.5rem 2rem;
    }

    .view { display: none; }
    .view.active { display: block; }

    .section-title {
        font-size: 1.1em;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0 0 1.5rem 0;
    }

    .albums-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 1.5rem;
    }

    .album-card {
        cursor: pointer;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        background: var(--bg-secondary);
        box-shadow: var(--shadow-md);
        transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.2s;
    }
    .album-card:hover {
        transform: translateY(-5px) scale(1.01);
        box-shadow: var(--shadow-lg);
        border-color: rgba(255,255,255,0.22);
    }

    .album-art {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .album-art .fallback-note {
        font-size: 2.2em;
        opacity: 0.5;
    }

    .album-card-body { padding: 0.9rem 1rem 1.1rem; }
    .album-card-title {
        font-weight: 600;
        font-size: 0.92rem;
        margin: 0 0 0.25rem 0;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .album-card-count {
        font-size: 0.78rem;
        color: var(--text-tertiary);
        margin: 0;
    }

    .album-header {
        display: flex;
        gap: 2rem;
        align-items: flex-end;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }
    .album-header-art {
        width: 190px;
        height: 190px;
        border-radius: 10px;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        box-shadow: var(--shadow-lg);
        flex-shrink: 0;
    }
    .album-header-info { flex: 1; min-width: 200px; }
    .album-header-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-tertiary);
        margin: 0 0 0.4rem 0;
    }
    .album-header-title {
        font-size: 2em;
        font-weight: 800;
        margin: 0 0 0.6rem 0;
        color: #fff;
    }
    .album-header-meta {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0 0 1.2rem 0;
    }

    .btn {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        border: none;
        border-radius: 24px;
        padding: 0.7rem 1.6rem;
        cursor: pointer;
        background: var(--accent-primary);
        color: #fff;
        transition: transform 0.15s ease, background 0.2s;
    }
    .btn:hover { background: #c877ff; transform: translateY(-1px); }
    .btn-ghost {
        background: transparent;
        border: 1px solid var(--border-primary);
        color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-tertiary);
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        cursor: pointer;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-primary); }

    .track-list {
        border-top: 1px solid var(--border-primary);
    }
    .track-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.85rem 0.5rem;
        border-bottom: 1px solid var(--border-primary);
        cursor: pointer;
        transition: background 0.15s;
        border-radius: 6px;
    }
    .track-row:hover { background: var(--bg-elevated); }
    .track-row.playing { background: rgba(182,88,255,0.1); }
    .track-row.playing .track-name { color: var(--accent-primary); }

    .track-index {
        width: 26px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 0.85rem;
        flex-shrink: 0;
    }
    .track-row.playing .track-index::before { content: '♪'; color: var(--accent-primary); }
    .track-row:not(.playing) .track-icon { display: none; }

    .track-thumb {
        width: 38px;
        height: 38px;
        border-radius: 4px;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }
    .track-name {
        flex: 1;
        font-size: 0.9rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .track-expand {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        padding: 4px;
        flex-shrink: 0;
        display: flex;
        transition: transform 0.2s, color 0.2s;
    }
    .track-expand:hover { color: var(--text-primary); }
    .track-expand svg { width: 16px; height: 16px; fill: currentColor; }
    .track-item.expanded .track-expand { transform: rotate(180deg); color: var(--accent-primary); }

    .track-details {
        display: none;
        padding: 0.5rem 0.5rem 1.2rem 2.7rem;
        border-bottom: 1px solid var(--border-primary);
    }
    .track-item.expanded .track-details { display: block; }

    .track-credits {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        line-height: 1.5;
    }
    .track-credits .featuring { color: var(--text-tertiary); font-style: italic; }

    .marker-group { margin-bottom: 0.9rem; }
    .marker-movement {
        font-size: 0.82rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 0.4rem;
    }
    .marker {
        display: flex;
        align-items: baseline;
        gap: 0.7rem;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .marker:hover { background: var(--bg-elevated); }
    .marker-time {
        flex-shrink: 0;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--accent-primary);
        background: rgba(182,88,255,0.12);
        border-radius: 4px;
        padding: 0.15rem 0.4rem;
        min-width: 42px;
        text-align: center;
    }
    .marker-body { flex: 1; }
    .marker-label {
        display: block;
        font-size: 0.78rem;
        font-style: italic;
        color: var(--text-tertiary);
        margin-bottom: 0.1rem;
    }
    .marker-text {
        display: block;
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .empty-state, .loading-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-tertiary);
    }
    .loading-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid var(--border-primary);
        border-top: 4px solid var(--accent-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Player bar */
    .player-bar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: var(--player-height);
        background: var(--bg-secondary);
        border-top: 1px solid var(--border-primary);
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1.5rem;
        z-index: 100;
        transform: translateY(100%);
        transition: transform 0.3s ease;
    }
    .player-bar.visible { transform: translateY(0); }

    .player-thumb {
        width: 52px;
        height: 52px;
        border-radius: 6px;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }

    .player-meta {
        width: 180px;
        flex-shrink: 0;
        overflow: hidden;
    }
    .player-song-name {
        font-size: 0.88rem;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .player-album-name {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .player-controls {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        flex-shrink: 0;
    }

    .player-btn {
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, transform 0.15s;
    }
    .player-btn:hover { color: var(--accent-primary); transform: scale(1.08); }
    .player-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .player-btn.play-btn svg { width: 26px; height: 26px; }

    .player-progress {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-width: 0;
    }
    .player-time {
        font-size: 0.72rem;
        color: var(--text-tertiary);
        width: 38px;
        flex-shrink: 0;
    }
    .player-time.time-end { text-align: right; }

    input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: var(--border-primary);
        flex: 1;
        cursor: pointer;
        outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-primary);
        cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-primary);
        border: none;
        cursor: pointer;
    }
    #seekBar { background: linear-gradient(to right, var(--accent-primary) 0%, var(--accent-primary) 0%, var(--border-primary) 0%); }

    .player-volume {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 110px;
        flex-shrink: 0;
    }
    #volumeBar { width: 80px; }

    @media (max-width: 768px) {
        .navbar { padding: 15px 20px; }
        .container { padding: 1.5rem 1rem; }
        .player-meta { width: 100px; }
        .player-volume { display: none; }
        .player-bar { gap: 0.6rem; padding: 0 1rem; }
        .album-header { gap: 1.2rem; }
        .album-header-art { width: 130px; height: 130px; }
        .album-header-title { font-size: 1.4em; }
    }
</style>
</head>
<body>

<nav class="navbar">
    <a href="/index.html" class="navbar-back">&larr; rmaitra.github.io</a>
    <h1 class="navbar-title">Loonatic Tunes</h1>
</nav>

<div class="container">

    <div id="loadingState" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading albums&hellip;</p>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
        <p>No albums found. Add entries to <code>loonatic-tunes.json</code> to get started.</p>
    </div>

    <div id="browseView" class="view">
        <h2 class="section-title">Albums</h2>
        <div id="albumsGrid" class="albums-grid"></div>
    </div>

    <div id="albumView" class="view">
        <div class="back-link" id="backToBrowse">&larr; All Albums</div>
        <div class="album-header">
            <div class="album-header-art" id="albumHeaderArt"></div>
            <div class="album-header-info">
                <p class="album-header-label">Album</p>
                <h2 class="album-header-title" id="albumHeaderTitle"></h2>
                <p class="album-header-meta" id="albumHeaderMeta"></p>
                <button class="btn" id="playAlbumBtn">Play Album</button>
            </div>
        </div>
        <div class="track-list" id="trackList"></div>
    </div>

</div>

<audio id="audioEl" preload="metadata"></audio>

<div class="player-bar" id="playerBar">
    <div class="player-thumb" id="playerThumb"></div>
    <div class="player-meta">
        <div class="player-song-name" id="playerSongName">&nbsp;</div>
        <div class="player-album-name" id="playerAlbumName">&nbsp;</div>
    </div>
    <div class="player-controls">
        <button class="player-btn" id="prevBtn" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="player-btn play-btn" id="playPauseBtn" title="Play/Pause">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="player-btn" id="nextBtn" title="Next">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
        </button>
    </div>
    <div class="player-progress">
        <span class="player-time" id="currentTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0">
        <span class="player-time time-end" id="durationTime">0:00</span>
    </div>
    <div class="player-volume">
        <button class="player-btn" id="muteBtn" title="Mute">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <input type="range" id="volumeBar" min="0" max="100" value="80">
    </div>
</div>

<script>
    let albums = [];
    let currentAlbumIndex = -1;
    let currentSongIndex = -1;

    const audioEl = document.getElementById('audioEl');
    const playerBar = document.getElementById('playerBar');
    const browseView = document.getElementById('browseView');
    const albumView = document.getElementById('albumView');

    function normalizeMediaUrl(url) {
        if (!url) return url;
        if (url.includes('dropbox.com')) {
            try {
                const u = new URL(url);
                u.searchParams.delete('dl');
                u.searchParams.set('raw', '1');
                return u.toString();
            } catch (e) {
                return url;
            }
        }
        return url;
    }

    async function loadAlbums() {
        try {
            const response = await fetch('./loonatic-tunes.json');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            albums = await response.json();
        } catch (error) {
            console.error('Error loading albums:', error);
            albums = [];
        }
        document.getElementById('loadingState').style.display = 'none';
        if (!albums.length) {
            document.getElementById('emptyState').style.display = 'block';
            return;
        }
        renderBrowse();
        showView('browse');
    }

    function showView(name) {
        browseView.classList.toggle('active', name === 'browse');
        albumView.classList.toggle('active', name === 'album');
    }

    function renderBrowse() {
        const grid = document.getElementById('albumsGrid');
        grid.innerHTML = '';
        albums.forEach((album, idx) => {
            const card = document.createElement('div');
            card.className = 'album-card';
            card.onclick = () => openAlbum(idx);

            const art = document.createElement('div');
            art.className = 'album-art';
            if (album.image) art.style.backgroundImage = `url("${normalizeMediaUrl(album.image)}")`;

            const body = document.createElement('div');
            body.className = 'album-card-body';
            body.innerHTML = `
                <p class="album-card-title">${escapeHtml(album.name || 'Untitled Album')}</p>
                <p class="album-card-count">${(album.songs || []).length} track${(album.songs || []).length === 1 ? '' : 's'}</p>
            `;

            card.appendChild(art);
            card.appendChild(body);
            grid.appendChild(card);
        });
    }

    function openAlbum(albumIndex) {
        currentAlbumIndex = albumIndex;
        const album = albums[albumIndex];

        document.getElementById('albumHeaderTitle').textContent = album.name || 'Untitled Album';
        document.getElementById('albumHeaderMeta').textContent = `${(album.songs || []).length} track${(album.songs || []).length === 1 ? '' : 's'}`;
        const headerArt = document.getElementById('albumHeaderArt');
        headerArt.style.backgroundImage = album.image ? `url("${normalizeMediaUrl(album.image)}")` : '';

        document.getElementById('playAlbumBtn').onclick = () => playSong(albumIndex, 0);

        renderTrackList(albumIndex);
        showView('album');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTrackList(albumIndex) {
        const album = albums[albumIndex];
        const list = document.getElementById('trackList');
        list.innerHTML = '';
        (album.songs || []).forEach((song, sIdx) => {
            const hasDetails = !!(song.credits || (song.timestamps && song.timestamps.length));

            const item = document.createElement('div');
            item.className = 'track-item';

            const row = document.createElement('div');
            row.className = 'track-row';
            if (albumIndex === currentAlbumIndex && sIdx === currentSongIndex) {
                row.classList.add('playing');
            }
            row.onclick = () => playSong(albumIndex, sIdx);

            const thumbUrl = normalizeMediaUrl(song.image || album.image);
            row.innerHTML = `
                <span class="track-index">${sIdx + 1}</span>
                <div class="track-thumb" style="${thumbUrl ? `background-image:url('${thumbUrl}')` : ''}"></div>
                <span class="track-name">${escapeHtml(song.name || 'Untitled Track')}</span>
                ${hasDetails ? `<button class="track-expand" title="Show details"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>` : ''}
            `;
            item.appendChild(row);

            if (hasDetails) {
                const details = document.createElement('div');
                details.className = 'track-details';
                details.innerHTML = buildTrackDetailsHtml(song);
                item.appendChild(details);

                const expandBtn = row.querySelector('.track-expand');
                expandBtn.onclick = (e) => {
                    e.stopPropagation();
                    item.classList.toggle('expanded');
                };

                details.querySelectorAll('.marker').forEach(markerEl => {
                    markerEl.onclick = () => seekToMarker(albumIndex, sIdx, parseFloat(markerEl.dataset.time));
                });
            }

            list.appendChild(item);
        });
    }

    function buildTrackDetailsHtml(song) {
        let html = '';

        if (song.credits) {
            const parts = [];
            if (song.credits.music_by) parts.push(`Music by ${escapeHtml(song.credits.music_by)}`);
            if (song.credits.featuring && song.credits.featuring.length) {
                const names = song.credits.featuring
                    .map(f => `${escapeHtml(f.name)}${f.role ? ` (${escapeHtml(f.role)})` : ''}`)
                    .join(', ');
                parts.push(`<span class="featuring">Featuring ${names}</span>`);
            }
            html += `<div class="track-credits">${parts.join('<br>')}</div>`;
        }

        if (song.timestamps && song.timestamps.length) {
            let groupsHtml = '';
            let currentMovement = null;
            let markersHtml = '';

            song.timestamps.forEach(ts => {
                if (ts.movement !== currentMovement) {
                    if (markersHtml) groupsHtml += `<div class="marker-group">${markersHtml}</div>`;
                    currentMovement = ts.movement;
                    markersHtml = ts.movement ? `<div class="marker-movement">${escapeHtml(ts.movement)}</div>` : '';
                }
                markersHtml += `
                    <div class="marker" data-time="${ts.time}">
                        <span class="marker-time">${formatTime(ts.time)}</span>
                        <span class="marker-body">
                            ${ts.label ? `<span class="marker-label">${escapeHtml(ts.label)}</span>` : ''}
                            <span class="marker-text">${escapeHtml(ts.text || '')}</span>
                        </span>
                    </div>
                `;
            });
            if (markersHtml) groupsHtml += `<div class="marker-group">${markersHtml}</div>`;

            html += `<div class="track-markers">${groupsHtml}</div>`;
        }

        return html;
    }

    function seekToMarker(albumIndex, songIndex, seconds) {
        const isCurrent = albumIndex === currentAlbumIndex && songIndex === currentSongIndex;
        if (isCurrent) {
            audioEl.currentTime = seconds;
            if (audioEl.paused) audioEl.play();
        } else {
            playSong(albumIndex, songIndex);
            audioEl.addEventListener('loadedmetadata', () => {
                audioEl.currentTime = seconds;
            }, { once: true });
        }
    }

    function playSong(albumIndex, songIndex) {
        const album = albums[albumIndex];
        const song = (album.songs || [])[songIndex];
        if (!song) return;

        currentAlbumIndex = albumIndex;
        currentSongIndex = songIndex;

        audioEl.src = normalizeMediaUrl(song.link);
        audioEl.play().catch(err => console.warn('Playback failed:', err));

        document.getElementById('playerSongName').textContent = song.name || 'Untitled Track';
        document.getElementById('playerAlbumName').textContent = album.name || '';
        const thumbUrl = normalizeMediaUrl(song.image || album.image);
        document.getElementById('playerThumb').style.backgroundImage = thumbUrl ? `url("${thumbUrl}")` : '';

        playerBar.classList.add('visible');

        if (albumView.classList.contains('active') && currentAlbumIndex === albumIndex) {
            renderTrackList(albumIndex);
        }
    }

    function playNext() {
        if (currentAlbumIndex === -1) return;
        const album = albums[currentAlbumIndex];
        const songs = album.songs || [];
        if (currentSongIndex + 1 < songs.length) {
            playSong(currentAlbumIndex, currentSongIndex + 1);
        }
    }

    function playPrev() {
        if (currentAlbumIndex === -1) return;
        if (currentSongIndex > 0) {
            playSong(currentAlbumIndex, currentSongIndex - 1);
        } else {
            audioEl.currentTime = 0;
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Player controls
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    playPauseBtn.onclick = () => {
        if (!audioEl.src) return;
        if (audioEl.paused) audioEl.play();
        else audioEl.pause();
    };

    audioEl.addEventListener('play', () => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = '';
    });
    audioEl.addEventListener('pause', () => {
        playIcon.style.display = '';
        pauseIcon.style.display = 'none';
    });
    audioEl.addEventListener('ended', playNext);

    document.getElementById('nextBtn').onclick = playNext;
    document.getElementById('prevBtn').onclick = playPrev;

    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    let isSeeking = false;

    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    audioEl.addEventListener('loadedmetadata', () => {
        durationTimeEl.textContent = formatTime(audioEl.duration);
    });

    audioEl.addEventListener('timeupdate', () => {
        if (isSeeking) return;
        const pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 : 0;
        seekBar.value = pct;
        seekBar.style.background = `linear-gradient(to right, var(--accent-primary) ${pct}%, var(--border-primary) ${pct}%)`;
        currentTimeEl.textContent = formatTime(audioEl.currentTime);
    });

    seekBar.addEventListener('input', () => {
        isSeeking = true;
        const pct = seekBar.value;
        seekBar.style.background = `linear-gradient(to right, var(--accent-primary) ${pct}%, var(--border-primary) ${pct}%)`;
    });
    seekBar.addEventListener('change', () => {
        if (audioEl.duration) {
            audioEl.currentTime = (seekBar.value / 100) * audioEl.duration;
        }
        isSeeking = false;
    });

    const volumeBar = document.getElementById('volumeBar');
    const muteBtn = document.getElementById('muteBtn');
    audioEl.volume = 0.8;
    volumeBar.addEventListener('input', () => {
        audioEl.volume = volumeBar.value / 100;
        audioEl.muted = false;
    });
    muteBtn.onclick = () => {
        audioEl.muted = !audioEl.muted;
    };

    document.getElementById('backToBrowse').onclick = () => showView('browse');

    loadAlbums();
</script>
</body>
</html>
