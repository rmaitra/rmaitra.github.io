<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loonatic Tunes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-primary: #000000;
        --bg-secondary: #0d0d0d;
        --bg-elevated: #161616;
        --text-primary: #e0e0e0;
        --text-secondary: #aaaaaa;
        --text-tertiary: #888888;
        --border-primary: #1e1e1e;
        --accent-primary: #b658ff;
        --accent-dim: #5c1280;
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.7);
        --player-height: 88px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        margin: 0;
        padding: 0 0 var(--player-height) 0;
    }

    a { color: inherit; text-decoration: none; }

    .navbar {
        background: #000;
        padding: 22px 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        border-bottom: 1px solid var(--border-primary);
    }

    .navbar-back {
        margin-left: auto;
        font-size: 0.85em;
        color: var(--text-tertiary);
        transition: color 0.2s;
    }
    .navbar-back:hover { color: var(--text-primary); }

    .navbar-search {
        flex: 1;
        max-width: 420px;
    }
    .search-input {
        width: 100%;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.85rem;
        color: var(--text-primary);
        background: var(--bg-elevated);
        border: 1px solid var(--border-primary);
        border-radius: 20px;
        padding: 0.5rem 1rem;
        outline: none;
        transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--text-tertiary); }
    .search-input:focus { border-color: var(--accent-primary); }

    .search-subtext {
        color: var(--text-tertiary);
        font-weight: 400;
    }

    .navbar-title {
        font-size: 1.3em;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #d9a3ff 0%, var(--accent-primary) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    /* Radio bar */
    .radio-bar {
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border-primary);
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1.25rem;
        height: 40px;
    }
    .radio-toggle {
        flex-shrink: 0;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent-dim);
        border: none;
        border-radius: 20px;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.2s;
    }
    .radio-toggle:hover { background: var(--accent-primary); }
    .radio-toggle.on { background: var(--accent-primary); }
    .radio-ticker-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 100%;
        overflow: hidden;
    }
    .radio-ticker {
        position: absolute;
        top: 50%;
        left: 100%;
        transform: translateY(-50%);
        white-space: nowrap;
        font-size: 0.78rem;
        color: var(--text-secondary);
        animation: radio-scroll 22s linear infinite;
    }
    @keyframes radio-scroll {
        from { left: 100%; }
        to   { left: -160%; }
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2.5rem 2rem;
    }

    .view { display: none; }
    .view.active { display: block; }

    .section-title {
        font-size: 1.1em;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0 0 1.5rem 0;
    }

    .albums-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, 190px);
        gap: 1.5rem;
    }

    .album-card {
        cursor: pointer;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        background: var(--bg-secondary);
        box-shadow: var(--shadow-md);
        transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.2s;
    }
    .album-card:hover {
        transform: translateY(-5px) scale(1.01);
        box-shadow: var(--shadow-lg);
        border-color: rgba(255,255,255,0.22);
    }

    .album-art {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .album-art .fallback-note {
        font-size: 2.2em;
        opacity: 0.5;
    }

    /* generated pixel-art fallback: scale the tiny canvas up crisply, no blur */
    .generated-art {
        background: none;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
    }

    .album-card-body { padding: 0.9rem 1rem 1.1rem; }
    .album-card-title {
        font-weight: 600;
        font-size: 0.92rem;
        margin: 0 0 0.25rem 0;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .album-card-artist {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin: 0 0 0.2rem 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .album-card-count {
        font-size: 0.78rem;
        color: var(--text-tertiary);
        margin: 0;
    }

    .album-header {
        display: flex;
        gap: 2rem;
        align-items: flex-end;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }
    .album-header-art {
        width: 190px;
        height: 190px;
        border-radius: 10px;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        box-shadow: var(--shadow-lg);
        flex-shrink: 0;
    }
    .album-header-info { flex: 1; min-width: 200px; }
    .album-header-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-tertiary);
        margin: 0 0 0.4rem 0;
    }
    .album-header-title {
        font-size: 2em;
        font-weight: 800;
        margin: 0 0 0.3rem 0;
        color: #fff;
    }
    .album-header-artist {
        font-size: 1.05rem;
        color: var(--text-secondary);
        margin: 0 0 0.6rem 0;
    }
    .album-header-meta {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 0 0 1.2rem 0;
    }

    .btn {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        border: none;
        border-radius: 24px;
        padding: 0.7rem 1.6rem;
        cursor: pointer;
        background: var(--accent-primary);
        color: #fff;
        transition: transform 0.15s ease, background 0.2s;
    }
    .btn:hover { background: #c877ff; transform: translateY(-1px); }
    .btn-ghost {
        background: transparent;
        border: 1px solid var(--border-primary);
        color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); }

    .album-header-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }
    .share-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }
    .share-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .track-share {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        padding: 4px;
        flex-shrink: 0;
        display: flex;
        transition: color 0.2s;
    }
    .track-share:hover { color: var(--accent-primary); }
    .track-share svg { width: 15px; height: 15px; fill: currentColor; }

    .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--player-height) + 20px);
        transform: translateX(-50%) translateY(10px);
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--border-primary);
        padding: 0.6rem 1.1rem;
        border-radius: 20px;
        font-size: 0.82rem;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 200;
        white-space: nowrap;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-tertiary);
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        cursor: pointer;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-primary); }

    .track-list {
        border-top: 1px solid var(--border-primary);
    }
    .track-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.85rem 0.5rem;
        border-bottom: 1px solid var(--border-primary);
        cursor: pointer;
        transition: background 0.15s;
        border-radius: 6px;
    }
    .track-row:hover { background: var(--bg-elevated); }
    .track-row.playing { background: rgba(182,88,255,0.1); }
    .track-row.playing .track-name { color: var(--accent-primary); }

    .track-index {
        width: 26px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 0.85rem;
        flex-shrink: 0;
    }
    .track-row.playing .track-index::before { content: '♪'; color: var(--accent-primary); }
    .track-row:not(.playing) .track-icon { display: none; }

    .track-thumb {
        width: 38px;
        height: 38px;
        border-radius: 4px;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }
    .track-name {
        flex: 1;
        font-size: 0.9rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .track-expand {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        padding: 4px;
        flex-shrink: 0;
        display: flex;
        transition: transform 0.2s, color 0.2s;
    }
    .track-expand:hover { color: var(--text-primary); }
    .track-expand svg { width: 16px; height: 16px; fill: currentColor; }
    .track-item.expanded .track-expand { transform: rotate(180deg); color: var(--accent-primary); }

    .track-details {
        display: none;
        padding: 0.5rem 0.5rem 1.2rem 2.7rem;
        border-bottom: 1px solid var(--border-primary);
    }
    .track-item.expanded .track-details { display: block; }

    .track-credits {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        line-height: 1.5;
    }
    .track-credits .featuring { color: var(--text-tertiary); font-style: italic; }

    .marker-group { margin-bottom: 0.9rem; }
    .marker-movement {
        font-size: 0.82rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 0.4rem;
    }
    .marker {
        display: flex;
        align-items: baseline;
        gap: 0.7rem;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .marker:hover { background: var(--bg-elevated); }
    .marker-time {
        flex-shrink: 0;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--accent-primary);
        background: rgba(182,88,255,0.12);
        border-radius: 4px;
        padding: 0.15rem 0.4rem;
        min-width: 42px;
        text-align: center;
    }
    .marker-body { flex: 1; }
    .marker-label {
        display: block;
        font-size: 0.78rem;
        font-style: italic;
        color: var(--text-tertiary);
        margin-bottom: 0.1rem;
    }
    .marker-text {
        display: block;
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .empty-state, .loading-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-tertiary);
    }
    .loading-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid var(--border-primary);
        border-top: 4px solid var(--accent-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Player bar */
    .player-bar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: var(--player-height);
        background: var(--bg-secondary);
        border-top: 1px solid var(--border-primary);
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1.5rem;
        z-index: 100;
        transform: translateY(100%);
        transition: transform 0.3s ease;
    }
    .player-bar.visible { transform: translateY(0); }

    .player-thumb {
        width: 52px;
        height: 52px;
        border-radius: 6px;
        background: linear-gradient(135deg, #200030 0%, #5c1280 100%);
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }

    .player-meta {
        width: 180px;
        flex-shrink: 0;
        overflow: hidden;
    }
    .player-song-name {
        font-size: 0.88rem;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .player-album-name {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .player-controls {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        flex-shrink: 0;
    }

    .player-btn {
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, transform 0.15s;
    }
    .player-btn:hover { color: var(--accent-primary); transform: scale(1.08); }
    .player-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .player-btn.play-btn svg { width: 26px; height: 26px; }

    .player-progress {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        min-width: 0;
    }
    .player-time {
        font-size: 0.72rem;
        color: var(--text-tertiary);
        width: 38px;
        flex-shrink: 0;
    }
    .player-time.time-end { text-align: right; }

    input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: var(--border-primary);
        flex: 1;
        cursor: pointer;
        outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-primary);
        cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-primary);
        border: none;
        cursor: pointer;
    }
    #seekBar { background: linear-gradient(to right, var(--accent-primary) 0%, var(--accent-primary) 0%, var(--border-primary) 0%); }

    .player-volume {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 110px;
        flex-shrink: 0;
    }
    #volumeBar { width: 80px; }

    @media (max-width: 768px) {
        :root { --player-height: 116px; }
        .navbar { padding: 15px 20px; flex-wrap: wrap; }
        .navbar-search { order: 3; flex: 1 1 100%; max-width: none; }
        .radio-bar { padding: 0 0.85rem; gap: 0.6rem; }
        .radio-toggle { font-size: 0.68rem; padding: 0.3rem 0.7rem; }
        .container { padding: 1.5rem 1rem; }
        .player-meta { width: 100px; }
        .player-volume { display: none; }
        .player-bar {
            height: auto;
            flex-wrap: wrap;
            gap: 0.6rem;
            row-gap: 0.5rem;
            padding: 0.6rem 1rem 0.7rem;
        }
        .player-progress { order: -1; flex: 1 1 100%; width: 100%; }
        .player-controls { margin-left: auto; }
        .album-header { gap: 1.2rem; }
        .album-header-art { width: 130px; height: 130px; }
        .albums-grid { grid-template-columns: repeat(auto-fill, 130px); }
        .album-header-title { font-size: 1.4em; }
    }
</style>
</head>
<body>

<nav class="navbar">
    <h1 class="navbar-title">Loonatic Tunes</h1>
    <div class="navbar-search">
        <input type="search" id="searchInput" class="search-input" placeholder="Search artists, songs, albums…">
    </div>
    <a href="/index.html" class="navbar-back">&larr; rmaitra.github.io</a>
</nav>

<div class="radio-bar" id="radioBar">
    <button class="radio-toggle" id="radioToggleBtn">📻 Tune In</button>
    <div class="radio-ticker-wrap">
        <div class="radio-ticker" id="radioTicker">
            <span id="radioTickerText">Tap &ldquo;Tune In&rdquo; to start Loonatic Radio&mdash;a random shuffle of every track in the library.</span>
        </div>
    </div>
</div>

<div class="container">

    <div id="loadingState" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading albums&hellip;</p>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
        <p>No albums found. Add entries to <code>loonatic-tunes.json</code> to get started.</p>
    </div>

    <div id="browseView" class="view">
        <h2 class="section-title">Albums</h2>
        <div id="albumsGrid" class="albums-grid"></div>
    </div>

    <div id="albumView" class="view"> 
        <div class="back-link" id="backToBrowse">&larr; All Albums</div>
        <div class="album-header">
            <div class="album-header-art" id="albumHeaderArt"></div>
            <div class="album-header-info">
                <p class="album-header-label">Album</p>
                <h2 class="album-header-title" id="albumHeaderTitle"></h2>
                <p class="album-header-artist" id="albumHeaderArtist"></p>
                <p class="album-header-meta" id="albumHeaderMeta"></p>
                <div class="album-header-actions">
                    <button class="btn" id="playAlbumBtn">Play Album</button>
                    <button class="btn btn-ghost share-btn" id="shareAlbumBtn" title="Copy link to this album">
                        <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                        Share
                    </button>
                </div>
            </div>
        </div>
        <div class="track-list" id="trackList"></div>
    </div>

    <div id="searchView" class="view">
        <div id="searchResults"></div>
    </div>

</div>

<audio id="audioEl" preload="metadata"></audio>

<div class="player-bar" id="playerBar">
    <div class="player-thumb" id="playerThumb"></div>
    <div class="player-meta">
        <div class="player-song-name" id="playerSongName">&nbsp;</div>
        <div class="player-album-name" id="playerAlbumName">&nbsp;</div>
    </div>
    <div class="player-controls">
        <button class="player-btn" id="prevBtn" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="player-btn play-btn" id="playPauseBtn" title="Play/Pause">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="player-btn" id="nextBtn" title="Next">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
        </button>
    </div>
    <div class="player-progress">
        <span class="player-time" id="currentTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0">
        <span class="player-time time-end" id="durationTime">0:00</span>
    </div>
    <div class="player-volume">
        <button class="player-btn" id="muteBtn" title="Mute">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <input type="range" id="volumeBar" min="0" max="100" value="80">
    </div>
</div>

<script>
    let albums = [];
    let currentAlbumIndex = -1;
    let currentSongIndex = -1;

    let radioMode = false;
    let radioQueue = [];
    let radioQueuePos = -1;

    const audioEl = document.getElementById('audioEl');
    const preloadEl = new Audio();
    preloadEl.preload = 'auto';
    const playerBar = document.getElementById('playerBar');
    const browseView = document.getElementById('browseView');
    const albumView = document.getElementById('albumView');
    const searchView = document.getElementById('searchView');

    function normalizeMediaUrl(url) {
        if (!url) return url;
        if (url.includes('dropbox.com')) {
            try {
                const u = new URL(url);
                u.searchParams.delete('dl');
                u.searchParams.set('raw', '1');
                return u.toString();
            } catch (e) {
                return url;
            }
        }
        return url;
    }

    // ─── Generated pixel art (fallback album art) ───────────────────────────────
    // Deterministic per title: same title always produces the same art.

    function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i);
            hash |= 0;
        }
        return hash;
    }

    function mulberry32(seed) {
        return function () {
            seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function generatePixelArt(seedText, gridSize = 30) {
        const rand = mulberry32(hashString(seedText || 'Untitled Album'));

        const hue = Math.floor(rand() * 360);
        const fg = `hsl(${hue}, 30%, 38%)`;
        const bg = `hsl(${(hue + 40) % 360}, 25%, 11%)`;

        const canvas = document.createElement('canvas');
        canvas.width = gridSize;
        canvas.height = gridSize;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, gridSize, gridSize);

        ctx.fillStyle = fg;
        const half = Math.ceil(gridSize / 2);
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < half; x++) {
                if (rand() > 0.55) {
                    ctx.fillRect(x, y, 1, 1);
                    ctx.fillRect(gridSize - 1 - x, y, 1, 1);
                }
            }
        }

        return canvas.toDataURL('image/png');
    }

    // cache generated art per-album object so it's computed once
    function getAlbumArt(album) {
        if (album.image) return normalizeMediaUrl(album.image);
        if (!album._generatedArt) {
            album._generatedArt = generatePixelArt(album.name);
        }
        return album._generatedArt;
    }

    // single source of truth so the album-card art and the albumHeaderArt always match
    function applyAlbumArt(el, album) {
        el.classList.toggle('generated-art', !album.image);
        el.style.backgroundImage = `url("${getAlbumArt(album)}")`;
    }

    async function loadAlbums() {
        try {
            const response = await fetch('./loonatic-tunes.json');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            albums = await response.json();
        } catch (error) {
            console.error('Error loading albums:', error);
            albums = [];
        }
        document.getElementById('loadingState').style.display = 'none';
        if (!albums.length) {
            document.getElementById('emptyState').style.display = 'block';
            return;
        }
        renderBrowse();
        applyUrlState();
    }

    // ─── Share links & deep-linking ────────────────────────────────────────────

    function buildShareUrl(albumIndex, songIndex) {
        const url = new URL(window.location.href);
        url.search = '';
        url.searchParams.set('album', albumIndex);
        if (songIndex !== undefined && songIndex !== null) {
            url.searchParams.set('song', songIndex);
        }
        return url.toString();
    }

    async function copyToClipboard(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (e) {
            return false;
        }
    }

    let toastTimeout;
    function showToast(text) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.textContent = text;
        clearTimeout(toastTimeout);
        toast.classList.add('visible');
        toastTimeout = setTimeout(() => toast.classList.remove('visible'), 1800);
    }

    async function shareLink(albumIndex, songIndex, label) {
        const url = buildShareUrl(albumIndex, songIndex);
        const ok = await copyToClipboard(url);
        if (ok) showToast(`${label} link copied!`);
        else window.prompt('Copy this link:', url);
    }

    function updateUrlForAlbum(albumIndex, { push = true } = {}) {
        const url = buildShareUrl(albumIndex);
        if (push) history.pushState({ album: albumIndex }, '', url);
        else history.replaceState({ album: albumIndex }, '', url);
    }

    function navigateToBrowse(opts = {}) {
        showView('browse');
        if (opts.updateUrl !== false) {
            const url = new URL(window.location.href);
            url.search = '';
            if (opts.push !== false) history.pushState({}, '', url);
            else history.replaceState({}, '', url);
        }
    }

    function applyUrlState() {
        const params = new URLSearchParams(window.location.search);
        const albumParam = params.get('album');
        const albumIndex = albumParam !== null ? parseInt(albumParam, 10) : NaN;

        if (isNaN(albumIndex) || !albums[albumIndex]) {
            showView('browse');
            return;
        }

        openAlbum(albumIndex, { updateUrl: false });

        const songParam = params.get('song');
        const songIndex = songParam !== null ? parseInt(songParam, 10) : NaN;
        if (!isNaN(songIndex) && (albums[albumIndex].songs || [])[songIndex]) {
            playSong(albumIndex, songIndex);
        }
    }

    window.addEventListener('popstate', () => applyUrlState());

    function showView(name) {
        browseView.classList.toggle('active', name === 'browse');
        albumView.classList.toggle('active', name === 'album');
        searchView.classList.toggle('active', name === 'search');
    }

    function buildAlbumCard(album, idx) {
        const card = document.createElement('div');
        card.className = 'album-card';
        card.onclick = () => openAlbum(idx);

        const art = document.createElement('div');
        art.className = 'album-art';
        applyAlbumArt(art, album);

        const body = document.createElement('div');
        body.className = 'album-card-body';
        body.innerHTML = `
            <p class="album-card-title">${escapeHtml(album.name || 'Untitled Album')}</p>
            ${album.artist ? `<p class="album-card-artist">${escapeHtml(album.artist)}</p>` : ''}
            <p class="album-card-count">${(album.songs || []).length} track${(album.songs || []).length === 1 ? '' : 's'}</p>
        `;

        card.appendChild(art);
        card.appendChild(body);
        return card;
    }

    function renderBrowse() {
        const grid = document.getElementById('albumsGrid');
        grid.innerHTML = '';
        albums.forEach((album, idx) => grid.appendChild(buildAlbumCard(album, idx)));
    }

    function openAlbum(albumIndex, opts = {}) {
        currentAlbumIndex = albumIndex;
        const album = albums[albumIndex];

        document.getElementById('albumHeaderTitle').textContent = album.name || 'Untitled Album';
        document.getElementById('albumHeaderArtist').textContent = album.artist || '';
        document.getElementById('albumHeaderMeta').textContent = `${(album.songs || []).length} track${(album.songs || []).length === 1 ? '' : 's'}`;
        const headerArt = document.getElementById('albumHeaderArt');
        applyAlbumArt(headerArt, album);

        document.getElementById('playAlbumBtn').onclick = () => playSong(albumIndex, 0);
        document.getElementById('shareAlbumBtn').onclick = () => shareLink(albumIndex, undefined, 'Album');

        renderTrackList(albumIndex);
        showView('album');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (opts.updateUrl !== false) {
            updateUrlForAlbum(albumIndex, { push: opts.push !== false });
        }
    }

    function renderTrackList(albumIndex) {
        const album = albums[albumIndex];
        const list = document.getElementById('trackList');
        list.innerHTML = '';
        (album.songs || []).forEach((song, sIdx) => {
            const hasDetails = !!(song.credits || (song.timestamps && song.timestamps.length));

            const item = document.createElement('div');
            item.className = 'track-item';

            const row = document.createElement('div');
            row.className = 'track-row';
            if (albumIndex === currentAlbumIndex && sIdx === currentSongIndex) {
                row.classList.add('playing');
            }
            row.onclick = () => playSong(albumIndex, sIdx);

            const thumbUrl = song.image ? normalizeMediaUrl(song.image) : getAlbumArt(album);
            const thumbGenerated = !song.image && !album.image;
            row.innerHTML = `
                <span class="track-index">${sIdx + 1}</span>
                <div class="track-thumb${thumbGenerated ? ' generated-art' : ''}" style="background-image:url('${thumbUrl}')"></div>
                <span class="track-name">${escapeHtml(song.name || 'Untitled Track')}</span>
                <button class="track-share" title="Copy link to this song"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></button>
                ${hasDetails ? `<button class="track-expand" title="Show details"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>` : ''}
            `;
            item.appendChild(row);

            row.querySelector('.track-share').onclick = (e) => {
                e.stopPropagation();
                shareLink(albumIndex, sIdx, 'Song');
            };

            if (hasDetails) {
                const details = document.createElement('div');
                details.className = 'track-details';
                details.innerHTML = buildTrackDetailsHtml(song);
                item.appendChild(details);

                const expandBtn = row.querySelector('.track-expand');
                expandBtn.onclick = (e) => {
                    e.stopPropagation();
                    item.classList.toggle('expanded');
                };

                details.querySelectorAll('.marker').forEach(markerEl => {
                    markerEl.onclick = () => seekToMarker(albumIndex, sIdx, parseFloat(markerEl.dataset.time));
                });
            }

            list.appendChild(item);
        });
    }

    function buildTrackDetailsHtml(song) {
        let html = '';

        if (song.credits) {
            const parts = [];
            if (song.credits.music_by) parts.push(`Music by ${escapeHtml(song.credits.music_by)}`);
            if (song.credits.featuring && song.credits.featuring.length) {
                const names = song.credits.featuring
                    .map(f => `${escapeHtml(f.name)}${f.role ? ` (${escapeHtml(f.role)})` : ''}`)
                    .join(', ');
                parts.push(`<span class="featuring">Featuring ${names}</span>`);
            }
            html += `<div class="track-credits">${parts.join('<br>')}</div>`;
        }

        if (song.timestamps && song.timestamps.length) {
            let groupsHtml = '';
            let currentMovement = null;
            let markersHtml = '';

            song.timestamps.forEach(ts => {
                if (ts.movement !== currentMovement) {
                    if (markersHtml) groupsHtml += `<div class="marker-group">${markersHtml}</div>`;
                    currentMovement = ts.movement;
                    markersHtml = ts.movement ? `<div class="marker-movement">${escapeHtml(ts.movement)}</div>` : '';
                }
                markersHtml += `
                    <div class="marker" data-time="${ts.time}">
                        <span class="marker-time">${formatTime(ts.time)}</span>
                        <span class="marker-body">
                            ${ts.label ? `<span class="marker-label">${escapeHtml(ts.label)}</span>` : ''}
                            <span class="marker-text">${escapeHtml(ts.text || '')}</span>
                        </span>
                    </div>
                `;
            });
            if (markersHtml) groupsHtml += `<div class="marker-group">${markersHtml}</div>`;

            html += `<div class="track-markers">${groupsHtml}</div>`;
        }

        return html;
    }

    function seekToMarker(albumIndex, songIndex, seconds) {
        const isCurrent = albumIndex === currentAlbumIndex && songIndex === currentSongIndex;
        if (isCurrent) {
            audioEl.currentTime = seconds;
            if (audioEl.paused) audioEl.play();
        } else {
            playSong(albumIndex, songIndex);
            audioEl.addEventListener('loadedmetadata', () => {
                audioEl.currentTime = seconds;
            }, { once: true });
        }
    }

    function playSong(albumIndex, songIndex, opts = {}) {
        const album = albums[albumIndex];
        const song = (album.songs || [])[songIndex];
        if (!song) return;

        if (!opts.radio && radioMode) {
            radioMode = false;
            updateRadioUI();
            resetTickerIdle();
        }

        currentAlbumIndex = albumIndex;
        currentSongIndex = songIndex;

        audioEl.src = normalizeMediaUrl(song.link);
        audioEl.play().catch(err => console.warn('Playback failed:', err));

        document.getElementById('playerSongName').textContent = song.name || 'Untitled Track';
        document.getElementById('playerAlbumName').textContent = album.name || '';
        const thumbUrl = song.image ? normalizeMediaUrl(song.image) : getAlbumArt(album);
        const playerThumb = document.getElementById('playerThumb');
        playerThumb.classList.toggle('generated-art', !song.image && !album.image);
        playerThumb.style.backgroundImage = `url("${thumbUrl}")`;

        playerBar.classList.add('visible');

        if (albumView.classList.contains('active') && currentAlbumIndex === albumIndex) {
            renderTrackList(albumIndex);
        }

        preloadNext();
    }

    function getUpcomingRef() {
        if (radioMode) return radioQueue[radioQueuePos + 1] || null;
        if (currentAlbumIndex === -1) return null;
        const songs = (albums[currentAlbumIndex].songs || []);
        return currentSongIndex + 1 < songs.length
            ? { albumIndex: currentAlbumIndex, songIndex: currentSongIndex + 1 }
            : null;
    }

    function preloadNext() {
        const ref = getUpcomingRef();
        if (!ref) return;
        const song = (albums[ref.albumIndex].songs || [])[ref.songIndex];
        if (!song || !song.link) return;
        const url = normalizeMediaUrl(song.link);
        if (preloadEl.src !== url) {
            preloadEl.src = url;
            preloadEl.load();
        }
    }

    function playNext() {
        if (radioMode) { playRadioAt(radioQueuePos + 1); return; }
        if (currentAlbumIndex === -1) return;
        const album = albums[currentAlbumIndex];
        const songs = album.songs || [];
        if (currentSongIndex + 1 < songs.length) {
            playSong(currentAlbumIndex, currentSongIndex + 1);
        }
    }

    function playPrev() {
        if (radioMode) { playRadioAt(Math.max(0, radioQueuePos - 1)); return; }
        if (currentAlbumIndex === -1) return;
        if (currentSongIndex > 0) {
            playSong(currentAlbumIndex, currentSongIndex - 1);
        } else {
            audioEl.currentTime = 0;
        }
    }

    // ─── Search ──────────────────────────────────────────────────────────────

    function songMatchesQuery(song, q) {
        if ((song.name || '').toLowerCase().includes(q)) return true;
        const credits = song.credits;
        if (!credits) return false;
        if ((credits.music_by || '').toLowerCase().includes(q)) return true;
        return (credits.featuring || []).some(f => (f.name || '').toLowerCase().includes(q));
    }

    function performSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
            showView('browse');
            return;
        }

        const albumMatches = [];
        const songMatches = [];
        albums.forEach((album, ai) => {
            const albumName = (album.name || '').toLowerCase();
            const albumArtist = (album.artist || '').toLowerCase();
            if (albumName.includes(q) || albumArtist.includes(q)) {
                albumMatches.push(ai);
            }
            (album.songs || []).forEach((song, si) => {
                if (songMatchesQuery(song, q)) {
                    songMatches.push({ albumIndex: ai, songIndex: si });
                }
            });
        });

        renderSearchResults(query, albumMatches, songMatches);
        showView('search');
    }

    function renderSearchResults(query, albumIdxs, songRefs) {
        const container = document.getElementById('searchResults');
        container.innerHTML = '';

        if (!albumIdxs.length && !songRefs.length) {
            container.innerHTML = `<div class="empty-state"><p>No results for &ldquo;${escapeHtml(query)}&rdquo;.</p></div>`;
            return;
        }

        if (albumIdxs.length) {
            const heading = document.createElement('h2');
            heading.className = 'section-title';
            heading.textContent = 'Albums';
            container.appendChild(heading);

            const grid = document.createElement('div');
            grid.className = 'albums-grid';
            albumIdxs.forEach(ai => grid.appendChild(buildAlbumCard(albums[ai], ai)));
            container.appendChild(grid);
        }

        if (songRefs.length) {
            const heading = document.createElement('h2');
            heading.className = 'section-title';
            heading.style.marginTop = albumIdxs.length ? '2rem' : '0';
            heading.textContent = 'Songs';
            container.appendChild(heading);

            const list = document.createElement('div');
            list.className = 'track-list';
            songRefs.forEach(ref => {
                const album = albums[ref.albumIndex];
                const song = (album.songs || [])[ref.songIndex];
                const row = document.createElement('div');
                row.className = 'track-row';
                row.onclick = () => playSong(ref.albumIndex, ref.songIndex);

                const thumbUrl = song.image ? normalizeMediaUrl(song.image) : getAlbumArt(album);
                const thumbGenerated = !song.image && !album.image;
                row.innerHTML = `
                    <div class="track-thumb${thumbGenerated ? ' generated-art' : ''}" style="background-image:url('${thumbUrl}')"></div>
                    <span class="track-name">${escapeHtml(song.name || 'Untitled Track')} <span class="search-subtext">— ${escapeHtml(album.name || 'Untitled Album')}</span></span>
                    <button class="track-share" title="Copy link to this song"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></button>
                `;
                row.querySelector('.track-share').onclick = (e) => {
                    e.stopPropagation();
                    shareLink(ref.albumIndex, ref.songIndex, 'Song');
                };
                list.appendChild(row);
            });
            container.appendChild(list);
        }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => performSearch(e.target.value));

    // ─── Loonatic Radio ──────────────────────────────────────────────────────

    function getAllSongRefs() {
        const refs = [];
        albums.forEach((album, ai) => {
            (album.songs || []).forEach((song, si) => {
                if (song.link) refs.push({ albumIndex: ai, songIndex: si });
            });
        });
        return refs;
    }

    function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function startRadio() {
        const refs = getAllSongRefs();
        if (!refs.length) return;
        radioMode = true;
        radioQueue = shuffleArray(refs);
        radioQueuePos = 0;
        updateRadioUI();
        playRadioAt(0);
    }

    function stopRadio() {
        radioMode = false;
        updateRadioUI();
        resetTickerIdle();
    }

    function playRadioAt(pos) {
        if (pos < 0) pos = 0;
        if (pos >= radioQueue.length) {
            radioQueue = shuffleArray(getAllSongRefs());
            pos = 0;
        }
        const ref = radioQueue[pos];
        if (!ref) return;
        radioQueuePos = pos;
        playSong(ref.albumIndex, ref.songIndex, { radio: true });
        updateNowPlayingTicker();
    }

    function songLabel(ref) {
        const album = albums[ref.albumIndex];
        const song = (album.songs || [])[ref.songIndex];
        return song ? (song.name || 'Untitled Track') : '';
    }

    function setTickerText(text) {
        document.getElementById('radioTickerText').textContent = text;
        const ticker = document.getElementById('radioTicker');
        ticker.style.animation = 'none';
        void ticker.offsetWidth;
        ticker.style.animation = '';
    }

    function resetTickerIdle() {
        setTickerText('Tap “Tune In” to start Loonatic Radio—a random shuffle of every track in the library.');
    }

    function updateNowPlayingTicker() {
        const current = radioQueue[radioQueuePos];
        if (!current) return;
        const album = albums[current.albumIndex];
        const upcoming = [];
        for (let i = 1; i <= 5; i++) {
            const ref = radioQueue[radioQueuePos + i];
            if (ref) upcoming.push(songLabel(ref));
        }
        let text = `📻 NOW PLAYING: ${songLabel(current)} — ${album.name || 'Untitled Album'}`;
        if (upcoming.length) text += `     •     UP NEXT: ${upcoming.join('   ·   ')}`;
        setTickerText(text);
    }

    function updateRadioUI() {
        const btn = document.getElementById('radioToggleBtn');
        btn.textContent = radioMode ? '⏸ Stop Radio' : '📻 Tune In';
        btn.classList.toggle('on', radioMode);
    }

    document.getElementById('radioToggleBtn').onclick = () => {
        if (radioMode) stopRadio(); else startRadio();
    };

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Player controls
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    playPauseBtn.onclick = () => {
        if (!audioEl.src) return;
        if (audioEl.paused) audioEl.play();
        else audioEl.pause();
    };

    audioEl.addEventListener('play', () => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = '';
    });
    audioEl.addEventListener('pause', () => {
        playIcon.style.display = '';
        pauseIcon.style.display = 'none';
    });
    audioEl.addEventListener('ended', playNext);

    document.getElementById('nextBtn').onclick = playNext;
    document.getElementById('prevBtn').onclick = playPrev;

    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    let isSeeking = false;

    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    audioEl.addEventListener('loadedmetadata', () => {
        durationTimeEl.textContent = formatTime(audioEl.duration);
    });

    audioEl.addEventListener('timeupdate', () => {
        if (isSeeking) return;
        const pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 : 0;
        seekBar.value = pct;
        seekBar.style.background = `linear-gradient(to right, var(--accent-primary) ${pct}%, var(--border-primary) ${pct}%)`;
        currentTimeEl.textContent = formatTime(audioEl.currentTime);
    });

    seekBar.addEventListener('input', () => {
        isSeeking = true;
        const pct = seekBar.value;
        seekBar.style.background = `linear-gradient(to right, var(--accent-primary) ${pct}%, var(--border-primary) ${pct}%)`;
    });
    seekBar.addEventListener('change', () => {
        if (audioEl.duration) {
            audioEl.currentTime = (seekBar.value / 100) * audioEl.duration;
        }
        isSeeking = false;
    });

    const volumeBar = document.getElementById('volumeBar');
    const muteBtn = document.getElementById('muteBtn');
    audioEl.volume = 0.8;
    volumeBar.addEventListener('input', () => {
        audioEl.volume = volumeBar.value / 100;
        audioEl.muted = false;
    });
    muteBtn.onclick = () => {
        audioEl.muted = !audioEl.muted;
    };

    document.getElementById('backToBrowse').onclick = () => navigateToBrowse();

    loadAlbums();
</script>
</body>
</html>
