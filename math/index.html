<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kosmos: A Mathematical Voyage</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.6/katex.min.css">
<style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0d0d0d;
      --bg-card: #111213;
      --text-primary: #e0e0e0;
      --text-secondary: #aaaaaa;
      --text-tertiary: #888888;
      --border-primary: #1e1e1e;
      --accent: #4a9eff;
      --accent-dim: #1f3a5c;
      --good: #35c97f;
      --good-bg: #10281c;
      --bad: #ff6b6b;
      --bad-bg: #2c1414;
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-primary);
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar h1 {
      font-size: 1.25rem;
      margin: 0;
      letter-spacing: -0.3px;
      font-weight: 700;
    }
    .brand-sub { font-weight: 400; font-size: 0.85rem; color: var(--text-tertiary); margin-left: 10px; letter-spacing: 0; }
    @media (max-width: 600px) { .brand-sub { display: block; margin-left: 0; margin-top: 2px; } }
    .st-tagline { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; font-style: italic; font-weight: 400; color: #e8dcc4; }
    .top-links { display: flex; gap: 16px; margin-top: 4px; }
    .home-link {
      color: var(--text-tertiary);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .home-link:hover { color: var(--accent); }
    .scoreboard {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #scoreText { color: var(--accent); font-weight: 600; }
    .reset-link {
      color: var(--text-tertiary);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .subject-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 24px 0 24px;
    }
    .subject-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      padding: 8px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .subject-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .subject-btn.active { background: var(--accent); border-color: var(--accent); color: #04101f; }
    .topic-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-primary);
    }
    .topic-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .topic-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .topic-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text-primary); }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }
    #topicHeader h2 { margin: 0 0 6px 0; font-size: 1.4rem; }
    .topic-desc { color: var(--text-secondary); margin: 0 0 20px 0; font-size: 0.95rem; }
    .mode-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-primary);
    }
    .mode-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      padding: 10px 18px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .mode-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .concept-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .concept-card h3 { margin: 0 0 8px 0; font-size: 1.1rem; color: var(--accent); }
    .concept-explanation { color: var(--text-secondary); margin: 0 0 14px 0; line-height: 1.5; }
    .example {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .example-problem, .example-solution { margin: 6px 0; line-height: 1.5; }
    .tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      border-radius: 4px;
      padding: 1px 6px;
      margin-right: 6px;
    }
    .tag-solution { color: var(--good); border-color: var(--good); }
    details { margin: 8px 0; }
    summary { cursor: pointer; color: var(--text-tertiary); font-size: 0.85rem; }
    summary:hover { color: var(--accent); }
    details ol { margin: 8px 0 0 0; padding-left: 20px; color: var(--text-secondary); line-height: 1.6; }
    .type-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .type-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      padding: 7px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .type-btn:hover { border-color: var(--accent); }
    .type-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text-primary); }
    .problem-card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      padding: 20px;
    }
    .problem-type-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    .problem-prompt {
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 16px;
      color: var(--text-primary);
    }
    .chart-container {
      margin: 4px 0 18px 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 10px;
    }
    .chart-container[data-square="true"] {
      display: flex;
      justify-content: center;
    }
    .scratch-label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
    .scratch-label span { color: var(--text-tertiary); font-size: 0.8rem; }
    .scratch-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .symbol-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 5px 11px;
      min-width: 34px;
      border-radius: 6px;
      cursor: pointer;
    }
    .symbol-btn:hover { border-color: var(--accent); color: var(--accent); }
    .symbol-btn.var-btn { color: var(--accent); font-style: italic; }
    #scratchpad {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px;
      resize: vertical;
      margin-bottom: 16px;
    }
    #scratchpad:focus { outline: none; border-color: var(--accent-dim); }
    .answer-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .field-row { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
    .field-row label { font-size: 0.8rem; color: var(--text-secondary); }
    .field-row input {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 8px 10px;
    }
    .field-row input:focus { outline: none; border-color: var(--accent); }
    .action-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
    button.primary, button.secondary {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-primary);
    }
    button.primary { background: var(--accent); color: #04101f; border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.1); }
    button.secondary { background: var(--bg-secondary); color: var(--text-secondary); }
    button.secondary:hover { border-color: var(--accent); color: var(--text-primary); }
    .feedback { margin-top: 4px; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; }
    .feedback.ok { background: var(--good-bg); color: var(--good); border: 1px solid var(--good); }
    .feedback.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
    .solution-box {
      margin-top: 16px;
      padding: 14px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
    }
    .solution-box h4 { margin: 0 0 8px 0; font-size: 0.95rem; color: var(--accent); }
    .solution-box ol { margin: 0 0 10px 0; padding-left: 20px; color: var(--text-secondary); line-height: 1.6; }
    .final-answer { margin: 0; color: var(--text-primary); }
    .final-answer strong { color: var(--good); }
    [hidden] { display: none !important; }

    /* ---------- Stories ---------- */
    .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-tertiary); font-weight: 600; }
    .link-btn { background: none; border: none; color: var(--text-tertiary); font-family: inherit; font-size: 0.9rem; cursor: pointer; padding: 4px 0; }
    .link-btn:hover { color: var(--accent); }
    .meter { display: block; height: 4px; border-radius: 2px; background: var(--border-primary); overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--accent); transition: width 0.3s ease; }
    .pills { display: flex; gap: 6px; }
    .pill {
      background: var(--bg-secondary); border: 1px solid var(--border-primary); color: var(--text-secondary);
      padding: 6px 14px; border-radius: 20px; font-family: inherit; font-size: 0.85rem; cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); color: var(--text-primary); }
    .pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text-primary); }

    .st-home-head h2 { font-size: 2rem; margin: 0 0 8px 0; letter-spacing: -0.5px; }
    .st-intro { color: var(--text-secondary); line-height: 1.6; margin: 0 0 18px 0; max-width: 640px; }
    .st-home-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .st-count { color: var(--text-tertiary); font-size: 0.85rem; }
    .tl-act { margin-top: 26px; }
    .tl-act-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin: 0 0 10px 0;
    }
    .tl-act-head span { color: var(--text-tertiary); font-weight: 400; letter-spacing: 0.5px; text-transform: none; }
    .tl-list { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--border-primary); display: flex; flex-direction: column; gap: 8px; }
    .tl-ready { margin-top: 22px; }
    .tl-list.flat { padding-left: 0; border-left: none; }
    .tl-list.flat .tl-item::before { display: none; }
    .tl-ready button.tl-card { border-color: var(--accent-dim); }
    .tl-item { position: relative; }
    .tl-item::before {
      content: ''; position: absolute; left: -21px; top: 22px; width: 10px; height: 10px; border-radius: 50%;
      background: var(--bg-primary); border: 2px solid var(--border-primary);
    }
    .tl-item:has(button)::before { border-color: var(--accent); background: var(--accent-dim); }
    .tl-item:has(.done)::before { border-color: var(--good); background: var(--good-bg); }
    .tl-card {
      width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
      background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 10px; padding: 12px 16px;
      color: var(--text-primary); font-family: inherit; font-size: 1rem;
    }
    button.tl-card { cursor: pointer; transition: border-color 0.15s ease; }
    button.tl-card:hover { border-color: var(--accent); }
    .tl-card.locked { opacity: 0.42; background: var(--bg-secondary); }
    .tl-card.review .tl-title { font-style: italic; }
    .tl-year { flex-shrink: 0; width: 92px; color: var(--text-tertiary); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .tl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .tl-title { font-weight: 600; }
    .tl-num { color: var(--text-tertiary); font-weight: 400; font-size: 0.85rem; }
    .tl-meta { color: var(--text-secondary); font-size: 0.84rem; }
    .tl-strands { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .tl-go { flex-shrink: 0; color: var(--accent); font-size: 0.84rem; font-weight: 600; }
    .tl-card.locked .tl-go { color: var(--text-tertiary); font-weight: 400; }
    .tl-card.done .tl-go { color: var(--good); }
    .tl-card .meter { width: 160px; margin-top: 4px; }
    .chip { font-size: 0.68rem; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border-primary); color: var(--text-secondary); }
    .chip-number { border-color: #6b5a2e; color: #e0c27a; }
    .chip-geometry { border-color: #2e5a4a; color: #7fd6b0; }
    .chip-algebra { border-color: #4a3a6e; color: #c3a6ff; }
    .chip-trig { border-color: #2e4f6b; color: #8cc4ff; }
    .chip-calculus { border-color: #6b3a4a; color: #ff9fb8; }
    .chip-probability { border-color: #5a5a2e; color: #d8d27a; }
    .chip-computing { border-color: #3a5a6b; color: #8fd0e0; }
    .chip-physics { border-color: #6b4a2e; color: #ffb27a; }

    .st-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .st-head { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--border-primary); }
    .st-head h2 { font-size: 2.2rem; margin: 6px 0 4px 0; letter-spacing: -0.5px; }
    .st-subtitle { color: var(--text-secondary); margin: 0 0 12px 0; font-size: 1.05rem; }
    .st-role { color: var(--text-secondary); margin-bottom: 14px; }
    .st-role strong { color: var(--text-primary); font-weight: 600; }
    .goals-label { font-size: 0.8rem; color: var(--text-tertiary); margin-bottom: 6px; }
    .goals { margin: 0; padding-left: 20px; color: var(--text-secondary); line-height: 1.6; }

    /* Spacer so the newest step can scroll up to reading height; dropped once the lesson is finished */
    .lesson-flow { padding-bottom: 55vh; }
    .lesson-flow.finished { padding-bottom: 24px; }
    .blk, .bubble, .narr, .turn, .turn-miss, .derive-row { scroll-margin-bottom: 110px; scroll-margin-top: 20px; animation: rise 0.35s ease both; }
    .blk { margin: 0 0 18px 0; }
    .no-anim { animation: none !important; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .blk, .bubble, .narr, .turn, .turn-miss, .derive-row, .w-chip { animation: none !important; } .w-part { transition: none !important; } }
    .l-h { font-size: 1.35rem; margin-top: 34px; letter-spacing: -0.3px; }
    .l-p { line-height: 1.7; color: var(--text-primary); font-size: 1.02rem; }
    .l-p.muted { color: var(--text-tertiary); font-size: 0.9rem; }
    .term { font-style: normal; color: #ffd27a; }

    .st-scene { border-left: 3px solid #ffd27a; padding: 4px 0 4px 18px; }
    .scene-year { font-size: 2.4rem; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
    .scene-place { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #ffd27a; margin: 4px 0 10px 0; }
    .st-scene p { margin: 0; line-height: 1.7; font-size: 1.05rem; }
    /* pixel map (pixelmap.js) */
    .st-scene.has-map { border-left: none; padding: 0; }
    .st-scene.has-map .scene-year, .st-scene.has-map .scene-place, .st-scene.has-map p { padding-left: 18px; border-left: 3px solid #ffd27a; }
    .st-scene.has-map .scene-year { padding-top: 6px; }
    .st-scene.has-map p { padding-bottom: 4px; }
    .st-map { margin-bottom: 18px; }
    .pm-frame { position: relative; border: 2px solid #2a2214; border-radius: 4px; overflow: hidden; background: #07121d; }
    .pm-canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    .pm-labels { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s ease; }
    .pm-labels.on { opacity: 1; }
    .pm-label {
      position: absolute; white-space: nowrap; font-family: 'Silkscreen', monospace; font-size: 13px; line-height: 1;
      color: #e8dcc4; text-shadow: 1px 0 #07121d, -1px 0 #07121d, 0 1px #07121d, 0 -1px #07121d, 1px 1px #07121d;
    }
    .pm-label.side-right { transform: translate(10px, -50%); }
    .pm-label.side-left { transform: translate(calc(-100% - 10px), -50%); }
    .pm-label.side-above { transform: translate(-50%, calc(-100% - 12px)); }
    .pm-label.side-below { transform: translate(-50%, 10px); }
    .pm-label.side-center { transform: translate(-50%, -50%); }
    .pm-pin-label { color: #ffd27a; font-size: 16px; transform: translate(10px, 20%) !important; }
    .pm-river-label { color: #8cc4ff; font-size: 12px; }
    .pm-sea-label { color: #5f86a8; font-size: 12px; letter-spacing: 1px; }
    @media (max-width: 600px) {
      .pm-label { font-size: 10px; }
      .pm-pin-label { font-size: 12px; }
      .pm-river-label { font-size: 9px; }
      .pm-sea-label { display: none; }
    }
    .pm-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 0.8rem; color: var(--text-tertiary); line-height: 1.5; }
    .pm-foot span:first-child { color: var(--text-secondary); flex-basis: 100%; }
    .pm-foot a { color: var(--accent); }
    .pm-credit { font-size: 0.72rem; }
    .pm-error .pm-canvas { min-height: 80px; }

    /* pixel pictures and characters (pixelart.js) */
    .st-picture { margin: 0 0 18px 0; }
    .px-frame { border: 2px solid #2a2214; border-radius: 4px; overflow: hidden; background: #07121d; line-height: 0; }
    .px-canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    .px-caption { margin-top: 8px; font-size: 0.82rem; color: var(--text-tertiary); line-height: 1.5; }
    .px-caption a { color: var(--accent); overflow-wrap: anywhere; }
    .st-scene .st-map { margin: 14px 0 0 0; }
    .person-portrait { flex-shrink: 0; line-height: 0; border: 1px solid #6b5a2e; border-radius: 6px; overflow: hidden; }
    .px-portrait { display: block; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
    .person-note { margin-top: 8px; color: var(--text-tertiary); font-size: 0.82rem; line-height: 1.5; }
    .bubble-row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; }
    .bubble-row.left { align-self: flex-start; }
    .bubble-row.right { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row .bubble { max-width: none; }
    .avatar { flex-shrink: 0; line-height: 0; border: 1px solid var(--border-primary); border-radius: 4px; overflow: hidden; }

    .st-person { display: flex; gap: 16px; align-items: flex-start; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 12px; padding: 16px 18px; }
    .monogram {
      flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
      background: #2a2214; border: 1px solid #6b5a2e; color: #ffd27a; font-weight: 700; letter-spacing: 1px;
    }
    .person-name { font-weight: 700; font-size: 1.1rem; }
    .person-meta { color: var(--text-tertiary); font-size: 0.85rem; margin: 2px 0 6px 0; }
    .person-bio { color: var(--text-secondary); line-height: 1.55; font-size: 0.95rem; }
    .st-quote { margin: 0 0 18px 0; padding: 4px 0 4px 20px; border-left: 2px solid var(--border-primary); }
    .st-quote blockquote { margin: 0; font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; font-size: 1.12rem; line-height: 1.6; color: #e8dcc4; font-style: italic; }
    .st-quote figcaption { margin-top: 8px; color: var(--text-tertiary); font-size: 0.82rem; }
    .st-thennow {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px 16px; align-items: center;

    .st-hints { margin: 8px 0 0 0; padding-left: 20px; color: var(--text-secondary); line-height: 1.6; }

    .st-widget { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 12px; padding: 16px 18px; }
    .w-svg { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }

    .w-note { color: var(--text-tertiary); font-size: 0.8rem; margin-top: 8px; }
    /* sun rays (Eratosthenes) */
    .sr { max-width: 400px; }
    .sr-earth { fill: #5a4a30; stroke: #b0986a; stroke-width: 2; }
    .sr-ray { stroke: #ffd27a; stroke-width: 1.2; opacity: 0.55; }
    .sr-ray-a { opacity: 0.9; }
    .sr-gnomon { stroke: #e8dcc4; stroke-width: 3; stroke-linecap: round; }
    .sr-shade { stroke: #0a0806; stroke-width: 5; stroke-linecap: round; }
    .sr-radius { stroke: #8cc4ff; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .sr-angle { fill: none; stroke: #ff9fb8; stroke-width: 2; }
    .sr-alpha { fill: #ff9fb8; font-size: 15px; font-style: italic; }

    .sr-label { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
    .sr-text { fill: var(--text-tertiary); font-size: 11px; }
    /* noon sun and latitude */
    .ns { max-width: 420px; }
    .ns-earth { fill: #2f5a74; stroke: #8cc4ff; stroke-width: 1.5; }
    .ns-night { fill: #0a1624; opacity: 0.55; }

    .ns-axis { stroke: #e8dcc4; stroke-width: 1; opacity: 0.35; }
    .ns-ray { stroke: #ffd27a; stroke-width: 1.2; opacity: 0.55; }

    .ns-label { color: var(--text-tertiary); font-size: 0.85rem; }

    /* sieve of Eratosthenes */
    .sv-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; max-width: 420px; }
    .sv-cell {
      display: grid; place-items: center; aspect-ratio: 1; border-radius: 6px; font-size: 0.85rem; font-variant-numeric: tabular-nums;

    .w-beam { position: relative; height: 34px; }
