<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Words</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #000000;
    --bg-secondary: #0d0d0d;
    --bg-card: #111213;
    --text-primary: #e0e0e0;
    --text-secondary: #aaaaaa;
    --text-tertiary: #888888;
    --border-primary: #1e1e1e;
    --accent: #4a9eff;
    --accent-dim: #1f3a5c;
    --good: #35c97f;
    --good-bg: #10281c;
    --bad: #ff6b6b;
    --bad-bg: #2c1414;
    --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border-primary);
    flex-wrap: wrap;
    gap: 10px 20px;
    flex: 0 0 auto;
  }
  .topbar-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .topbar h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.3px; font-weight: 700; }
  .home-link { color: var(--text-tertiary); text-decoration: none; font-size: 0.85rem; }
  .home-link:hover { color: var(--accent); }

  .tab-nav {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-secondary);
    padding: 8px 16px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--text-primary); }
  .tab-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text-primary); }

  main {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 24px;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pane { display: none; flex: 1; min-height: 0; }
  .pane.active { display: flex; flex-direction: column; }

  /* Browse */
  .search-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; flex: 0 0 auto; }
  .table-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; border: 1px solid var(--border-primary); border-radius: 8px; }
  .search-input {
    flex: 1;
    min-width: 200px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-primary);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .result-count { color: var(--text-tertiary); font-size: 0.8rem; white-space: nowrap; }

  .letter-filter { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; flex: 0 0 auto; }
  .letter-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-secondary);
    padding: 3px 7px;
    min-width: 24px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.72rem;
    line-height: 1.3;
  }
  .letter-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); }
  .letter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  .letter-btn:disabled { opacity: 0.3; cursor: default; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-tertiary);
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-primary);
    position: sticky;
    top: 0;
    background: var(--bg-primary);
  }
  tbody td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border-primary);
    font-size: 0.88rem;
    vertical-align: top;
  }
  tbody td.word-cell { font-weight: 600; color: #fff; white-space: nowrap; }
  tbody td.meaning-cell { color: var(--text-secondary); line-height: 1.4; }
  tbody td.example-cell { color: var(--text-tertiary); line-height: 1.4; font-style: italic; }
  tbody td.example-cell .no-example { opacity: 0.5; font-style: normal; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--bg-secondary); }

  /* Word modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border-primary);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-word { font-size: 1.5rem; font-weight: 700; color: #fff; }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-tertiary);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  .modal-close:hover { color: var(--text-primary); }
  .modal-section { margin-bottom: 16px; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .modal-meaning { color: var(--text-primary); font-size: 1rem; line-height: 1.5; }
  .modal-def-item { color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }
  .modal-def-item .pos { color: var(--accent); font-style: italic; margin-right: 6px; }
  .modal-example-item { color: var(--text-secondary); line-height: 1.5; font-style: italic; margin-bottom: 6px; }
  .modal-example-item::before { content: "\201C"; }
  .modal-example-item::after { content: "\201D"; }
  .modal-etymology { color: var(--text-secondary); line-height: 1.5; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 0 4px; flex: 0 0 auto; }
  .pager button {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
  }
  .pager button:disabled { opacity: 0.35; cursor: default; }
  .pager button:not(:disabled):hover { border-color: var(--accent); }
  .pager span { color: var(--text-tertiary); font-size: 0.85rem; }

  /* Quiz */
  #quizPane { align-items: stretch; }
  .quiz-card {
    background: var(--bg-card);
    border: 1px solid var(--border-primary);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  .quiz-setup label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .option-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .option-chip {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-secondary);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
  }
  .option-chip.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  .start-btn, .primary-btn {
    background: var(--accent);
    border: none;
    color: #04101f;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
  }
  .start-btn:hover, .primary-btn:hover { filter: brightness(1.1); }

  .quiz-progress { color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 10px; }
  .quiz-score { color: var(--accent); font-weight: 600; }
  .quiz-prompt-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); margin-bottom: 6px; }
  .quiz-prompt { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 18px; word-break: break-word; }
  .quiz-prompt.small { font-size: 1.1rem; font-weight: 500; color: var(--text-primary); line-height: 1.5; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .choice-btn {
    text-align: left;
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-primary);
    padding: 14px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.4;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: var(--good-bg); border-color: var(--good); color: #cdf7e0; }
  .choice-btn.incorrect { background: var(--bad-bg); border-color: var(--bad); color: #ffd6d6; }

  .quiz-footer { display: flex; justify-content: space-between; align-items: center; }
  .quiz-quit { color: var(--text-tertiary); text-decoration: underline; cursor: pointer; font-size: 0.8rem; background: none; border: none; font-family: inherit; }

  .results-list { max-height: 260px; overflow-y: auto; margin: 18px 0; border-top: 1px solid var(--border-primary); }
  .results-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-primary); font-size: 0.85rem; }
  .results-row .rw { font-weight: 600; color: #fff; white-space: nowrap; }
  .results-row .rm { color: var(--text-secondary); text-align: right; }
  .results-row.wrong .rw { color: var(--bad); }

  /* Typed-answer modes (typed recall, cloze) */
  .text-answer-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .text-input {
    flex: 1;
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-primary);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
  }
  .text-input:focus { outline: none; border-color: var(--accent); }
  .text-input.correct { border-color: var(--good); background: var(--good-bg); color: #cdf7e0; }
  .text-input.incorrect { border-color: var(--bad); background: var(--bad-bg); color: #ffd6d6; }
  .answer-feedback { font-size: 0.85rem; margin-bottom: 14px; min-height: 1.2em; }
  .answer-feedback.correct { color: var(--good); }
  .answer-feedback.incorrect { color: var(--bad); }

  .cloze-context { color: var(--text-tertiary); font-size: 0.85rem; line-height: 1.5; margin-bottom: 10px; font-weight: 400; }
  .cloze-sentence { color: var(--text-primary); font-size: 1.15rem; font-weight: 600; line-height: 1.5; }

  /* Hangman */
  .hangman-meaning { color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; }
  .hangman-word { font-size: 1.7rem; letter-spacing: 5px; font-weight: 700; color: #fff; margin-bottom: 14px; font-family: 'Space Grotesk', monospace; word-break: break-word; }
  .hangman-misses { color: var(--text-tertiary); font-size: 0.85rem; margin-bottom: 16px; }
  .keyboard { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .key-btn {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    color: var(--text-primary);
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
  }
  .key-btn:hover:not(:disabled) { border-color: var(--accent); }
  .key-btn:disabled { cursor: default; opacity: 0.4; }
  .key-btn.correct-key { background: var(--good-bg); border-color: var(--good); color: #cdf7e0; opacity: 1; }
  .key-btn.wrong-key { background: var(--bad-bg); border-color: var(--bad); color: #ffd6d6; opacity: 1; }

  @media (max-width: 640px) {
    main { padding: 16px; }
    .quiz-prompt { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1>GRE Words</h1>
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="browse">Browse</button>
      <button class="tab-btn" data-tab="quiz">Quiz</button>
    </div>
  </div>
  <a class="home-link" href="/">&larr; back home</a>
</div>

<main>
  <div id="loading" style="color: var(--text-tertiary); padding: 40px 0; text-align: center;">Loading word list&hellip;</div>

  <section id="browsePane" class="pane">
    <div class="search-row">
      <input id="searchInput" class="search-input" type="text" placeholder="Search word or definition&hellip;" />
      <span id="resultCount" class="result-count"></span>
    </div>
    <div id="letterFilter" class="letter-filter"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width: 140px;">Word</th><th>Meaning</th><th>Example</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prevPage">&larr; Prev</button>
      <span id="pageLabel"></span>
      <button id="nextPage">Next &rarr;</button>
    </div>
  </section>

  <section id="quizPane" class="pane">
    <div class="quiz-card">

      <div id="quizSetup" class="quiz-setup">
        <label>Quiz type</label>
        <div class="option-group" id="modeOptions">
          <button class="option-chip active" data-mode="multipleChoice">Multiple choice</button>
          <button class="option-chip" data-mode="typedRecall">Typed recall</button>
          <button class="option-chip" data-mode="cloze">Fill in the blank</button>
          <button class="option-chip" data-mode="synonymAntonym">Synonym / Antonym</button>
          <button class="option-chip" data-mode="hangman">Hangman</button>
        </div>
        <label>Number of questions</label>
        <div class="option-group" id="lengthOptions">
          <button class="option-chip" data-len="10">10</button>
          <button class="option-chip active" data-len="20">20</button>
          <button class="option-chip" data-len="50">50</button>
          <button class="option-chip" data-len="100">100</button>
        </div>
        <div id="directionSection">
          <label>Question direction</label>
          <div class="option-group" id="directionOptions">
            <button class="option-chip active" data-dir="wordToMeaning">Word &rarr; pick meaning</button>
            <button class="option-chip" data-dir="meaningToWord">Meaning &rarr; pick word</button>
          </div>
        </div>
        <button class="start-btn" id="startQuizBtn">Start Quiz</button>
      </div>

      <div id="quizRun" style="display:none;">
        <div class="quiz-progress">
          Question <span id="qIndex"></span> / <span id="qTotal"></span>
          &nbsp;&middot;&nbsp; Score: <span class="quiz-score"><span id="qScore">0</span></span>
        </div>
        <div class="quiz-prompt-label" id="promptLabel"></div>
        <div id="quizPrompt" class="quiz-prompt"></div>
        <div id="quizChoices" class="choices"></div>
        <div class="quiz-footer">
          <button class="quiz-quit" id="quitQuizBtn">Quit quiz</button>
          <button class="primary-btn" id="nextQuestionBtn" style="display:none;">Next &rarr;</button>
        </div>
      </div>

      <div id="quizResults" style="display:none;">
        <div class="quiz-prompt">Score: <span id="finalScore"></span> / <span id="finalTotal"></span></div>
        <div id="missedList"></div>
        <button class="start-btn" id="restartQuizBtn">New Quiz</button>
      </div>

    </div>
  </section>
</main>

<div id="wordModalOverlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-word" id="modalWord"></div>
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let WORDS = [];
const PAGE_SIZE = 100;
let currentPage = 0;
let filtered = [];
let searchQuery = '';
let currentLetter = '';

async function loadWords() {
  const res = await fetch('./words.json');
  WORDS = await res.json();
  WORDS.sort((a, b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()));
  document.getElementById('loading').style.display = 'none';
  buildLetterFilter();
  filtered = WORDS;
  renderTable();
}

// ---------- Browse ----------
const ALPHABET_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

function buildLetterFilter() {
  const present = new Set(WORDS.map(w => w.word[0].toUpperCase()).filter(c => /[A-Z]/.test(c)));
  const el = document.getElementById('letterFilter');
  const allBtn = `<button class="letter-btn active" data-letter="">All</button>`;
  const letterBtns = ALPHABET_LETTERS.map(letter => {
    const has = present.has(letter);
    return `<button class="letter-btn" data-letter="${letter}" ${has ? '' : 'disabled'}>${letter}</button>`;
  }).join('');
  el.innerHTML = allBtn + letterBtns;
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('.letter-btn');
    if (!btn || btn.disabled) return;
    document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLetter = btn.dataset.letter;
    applyFilters();
  });
}

function applyFilters() {
  filtered = WORDS.filter(w => {
    const matchesSearch = !searchQuery || w.word.toLowerCase().includes(searchQuery) || w.meaning.toLowerCase().includes(searchQuery);
    const matchesLetter = !currentLetter || w.word[0].toUpperCase() === currentLetter;
    return matchesSearch && matchesLetter;
  });
  currentPage = 0;
  renderTable();
}

function renderTable() {
  const body = document.getElementById('tableBody');
  const start = currentPage * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  body.innerHTML = pageItems.map(w => {
    const example = w.examples && w.examples.length ? escapeHtml(w.examples[0]) : '<span class="no-example">&mdash;</span>';
    return `<tr data-word="${escapeHtml(w.word)}"><td class="word-cell">${escapeHtml(w.word)}</td><td class="meaning-cell">${escapeHtml(w.meaning)}</td><td class="example-cell">${example}</td></tr>`;
  }).join('');
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  document.getElementById('pageLabel').textContent = `Page ${currentPage + 1} of ${totalPages}`;
  document.getElementById('resultCount').textContent = `${filtered.length.toLocaleString()} words`;
  document.getElementById('prevPage').disabled = currentPage === 0;
  document.getElementById('nextPage').disabled = currentPage >= totalPages - 1;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  applyFilters();
});
document.getElementById('prevPage').addEventListener('click', () => { if (currentPage > 0) { currentPage--; renderTable(); } });
document.getElementById('nextPage').addEventListener('click', () => {
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage < totalPages - 1) { currentPage++; renderTable(); }
});

// ---------- Word modal ----------
const KNOWN_FIELD_LABELS = {
  word: null,
  meaning: 'Meaning',
  definitions: 'Definitions',
  examples: 'Examples',
  etymology: 'Etymology',
  ipa: null,
  syllables: null,
  synonyms: 'Synonyms',
  antonyms: 'Antonyms',
  cloze: 'Fill in the blank',
};

document.getElementById('tableBody').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-word]');
  if (!row) return;
  const item = WORDS.find(w => w.word === row.dataset.word);
  if (item) openWordModal(item);
});

function openWordModal(item) {
  document.getElementById('modalWord').textContent = item.word;
  const bodyEl = document.getElementById('modalBody');
  let html = '';

  if (item.ipa || item.syllables) {
    const parts = [item.ipa, item.syllables].filter(Boolean).map(escapeHtml);
    html += `<div class="modal-section"><div class="modal-section-label">Pronunciation</div><div class="modal-meaning">${parts.join(' &middot; ')}</div></div>`;
  }
  if (item.meaning) {
    html += `<div class="modal-section"><div class="modal-section-label">Meaning</div><div class="modal-meaning">${escapeHtml(item.meaning)}</div></div>`;
  }
  if (item.definitions && item.definitions.length) {
    html += `<div class="modal-section"><div class="modal-section-label">Definitions</div>` +
      item.definitions.map(d =>
        `<div class="modal-def-item">${d.pos ? `<span class="pos">${escapeHtml(d.pos)}</span>` : ''}${escapeHtml(d.gloss || d)}</div>`
      ).join('') + `</div>`;
  }
  if (item.examples && item.examples.length) {
    html += `<div class="modal-section"><div class="modal-section-label">Examples</div>` +
      item.examples.map(ex => `<div class="modal-example-item">${escapeHtml(ex)}</div>`).join('') + `</div>`;
  }
  if (item.synonyms && item.synonyms.length) {
    html += `<div class="modal-section"><div class="modal-section-label">Synonyms</div><div class="modal-meaning">${item.synonyms.map(escapeHtml).join(', ')}</div></div>`;
  }
  if (item.antonyms && item.antonyms.length) {
    html += `<div class="modal-section"><div class="modal-section-label">Antonyms</div><div class="modal-meaning">${item.antonyms.map(escapeHtml).join(', ')}</div></div>`;
  }
  if (item.cloze) {
    html += `<div class="modal-section"><div class="modal-section-label">Fill in the blank</div><div class="modal-meaning">${escapeHtml(item.cloze)}</div></div>`;
  }
  if (item.etymology) {
    html += `<div class="modal-section"><div class="modal-section-label">Etymology</div><div class="modal-etymology">${escapeHtml(item.etymology)}</div></div>`;
  }

  // Any other fields not explicitly handled above, shown generically for forward-compatibility.
  Object.keys(item).forEach(key => {
    if (key in KNOWN_FIELD_LABELS) return;
    const value = item[key];
    if (value == null || (Array.isArray(value) && value.length === 0) || value === '') return;
    const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
    let text;
    if (typeof value === 'string') {
      text = value;
    } else if (Array.isArray(value) && value.every(v => typeof v === 'string')) {
      text = value.join(', ');
    } else {
      text = JSON.stringify(value);
    }
    html += `<div class="modal-section"><div class="modal-section-label">${escapeHtml(label)}</div><div class="modal-etymology">${escapeHtml(text)}</div></div>`;
  });

  bodyEl.innerHTML = html;
  document.getElementById('wordModalOverlay').classList.add('open');
}

function closeWordModal() {
  document.getElementById('wordModalOverlay').classList.remove('open');
}

document.getElementById('modalClose').addEventListener('click', closeWordModal);
document.getElementById('wordModalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'wordModalOverlay') closeWordModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeWordModal();
});

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('browsePane').classList.toggle('active', tab === 'browse');
    document.getElementById('quizPane').classList.toggle('active', tab === 'quiz');
  });
});
document.getElementById('browsePane').classList.add('active');

// ---------- Quiz ----------
let quizLength = 20;
let quizDirection = 'wordToMeaning';
let quizMode = 'multipleChoice';
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizMissed = [];
let hangmanState = null;

document.getElementById('modeOptions').addEventListener('click', (e) => {
  if (!e.target.dataset.mode) return;
  document.querySelectorAll('#modeOptions .option-chip').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  quizMode = e.target.dataset.mode;
  document.getElementById('directionSection').style.display = quizMode === 'multipleChoice' ? '' : 'none';
});
document.getElementById('lengthOptions').addEventListener('click', (e) => {
  if (!e.target.dataset.len) return;
  document.querySelectorAll('#lengthOptions .option-chip').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  quizLength = parseInt(e.target.dataset.len, 10);
});
document.getElementById('directionOptions').addEventListener('click', (e) => {
  if (!e.target.dataset.dir) return;
  document.querySelectorAll('#directionOptions .option-chip').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  quizDirection = e.target.dataset.dir;
});

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Mirrors the inflection set generate_cloze.py considers when it blanks a word
// out of an example sentence, since the exact inflected form that got blanked
// isn't stored — only the resulting sentence.
function inflections(word) {
  const w = word.toLowerCase();
  const forms = new Set([w]);
  if (w.endsWith('e') && w.length > 2) {
    const st = w.slice(0, -1);
    forms.add(st + 'ed'); forms.add(st + 'ing'); forms.add(w + 's');
  } else if (w.length > 1 && w.endsWith('y') && !'aeiou'.includes(w[w.length - 2])) {
    const st = w.slice(0, -1);
    forms.add(st + 'ies'); forms.add(w + 'ing'); forms.add(w + 'ed');
  } else if (/(s|x|z|ch|sh)$/.test(w)) {
    forms.add(w + 'es'); forms.add(w + 'ed'); forms.add(w + 'ing');
  } else {
    forms.add(w + 's'); forms.add(w + 'ed'); forms.add(w + 'ing');
  }
  return forms;
}
function normalizeAnswer(s) {
  return (s || '').toLowerCase().trim().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ');
}

// Blanks out occurrences of `word` (and its simple inflections) inside `text`,
// so a quiz clue never leaks the answer it's testing. Only used for active,
// unanswered quiz prompts/clues - Browse, the word modal, and the post-quiz
// results review always show the real, unmasked meaning.
function maskAnswerInText(text, word) {
  if (!text) return text;
  const forms = Array.from(inflections(word)).sort((a, b) => b.length - a.length);
  const escaped = forms.map(f => f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const pattern = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'gi');
  return text.replace(pattern, '___');
}
function maskedMeaning(item) {
  return maskAnswerInText(item.meaning, item.word);
}

document.getElementById('startQuizBtn').addEventListener('click', () => {
  let pool;
  if (quizMode === 'cloze') {
    pool = WORDS.filter(w => w.cloze);
  } else if (quizMode === 'synonymAntonym') {
    pool = WORDS.filter(w => (w.synonyms && w.synonyms.length) || (w.antonyms && w.antonyms.length));
  } else {
    pool = WORDS;
  }
  const chosen = shuffle(pool).slice(0, Math.min(quizLength, pool.length));

  if (quizMode === 'multipleChoice') {
    quizQuestions = chosen.map(item => {
      const wrongPool = shuffle(WORDS.filter(w => w.word !== item.word)).slice(0, 3);
      const options = shuffle([item, ...wrongPool]);
      return { item, options };
    });
  } else if (quizMode === 'synonymAntonym') {
    quizQuestions = chosen.map(item => {
      const hasSyn = item.synonyms && item.synonyms.length;
      const hasAnt = item.antonyms && item.antonyms.length;
      const relation = (hasSyn && hasAnt) ? (Math.random() < 0.5 ? 'synonym' : 'antonym') : (hasSyn ? 'synonym' : 'antonym');
      const pickFrom = relation === 'synonym' ? item.synonyms : item.antonyms;
      const correct = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      const distractorPool = shuffle(WORDS.filter(w => w.word !== item.word))
        .map(w => w.word)
        .filter(w => w.toLowerCase() !== correct.toLowerCase());
      const options = shuffle([correct, ...distractorPool.slice(0, 3)]);
      return { item, relation, correct, options };
    });
  } else {
    // typedRecall, cloze, hangman all just need the target item
    quizQuestions = chosen.map(item => ({ item }));
  }

  quizIndex = 0;
  quizScore = 0;
  quizMissed = [];
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('quizResults').style.display = 'none';
  document.getElementById('quizRun').style.display = 'block';
  document.getElementById('qTotal').textContent = quizQuestions.length;
  renderQuestion();
});

function renderQuestion() {
  const q = quizQuestions[quizIndex];
  document.getElementById('qIndex').textContent = quizIndex + 1;
  document.getElementById('qScore').textContent = quizScore;
  document.getElementById('nextQuestionBtn').style.display = 'none';

  const promptEl = document.getElementById('quizPrompt');
  const labelEl = document.getElementById('promptLabel');
  const choicesEl = document.getElementById('quizChoices');
  promptEl.classList.remove('small');
  choicesEl.innerHTML = '';

  if (quizMode === 'multipleChoice') renderMultipleChoice(q, promptEl, labelEl, choicesEl);
  else if (quizMode === 'typedRecall') renderTypedRecall(q, promptEl, labelEl, choicesEl);
  else if (quizMode === 'cloze') renderCloze(q, promptEl, labelEl, choicesEl);
  else if (quizMode === 'synonymAntonym') renderSynonymAntonym(q, promptEl, labelEl, choicesEl);
  else if (quizMode === 'hangman') renderHangman(q, promptEl, labelEl, choicesEl);
}

// ---- Multiple choice (word <-> meaning) ----
function renderMultipleChoice(q, promptEl, labelEl, choicesEl) {
  if (quizDirection === 'wordToMeaning') {
    labelEl.textContent = 'What does this word mean?';
    promptEl.textContent = q.item.word;
  } else {
    labelEl.textContent = 'Which word matches this meaning?';
    promptEl.textContent = maskedMeaning(q.item);
    promptEl.classList.add('small');
  }
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = quizDirection === 'wordToMeaning' ? maskedMeaning(opt) : opt.word;
    btn.addEventListener('click', () => selectAnswer(opt, btn));
    choicesEl.appendChild(btn);
  });
}
function selectAnswer(opt, btnEl) {
  const q = quizQuestions[quizIndex];
  const correct = opt.word === q.item.word;
  finishChoiceQuestion(correct, btnEl, b =>
    quizDirection === 'wordToMeaning' ? b.textContent === maskedMeaning(q.item) : b.textContent === q.item.word
  );
}

// ---- Synonym / Antonym ----
function renderSynonymAntonym(q, promptEl, labelEl, choicesEl) {
  labelEl.textContent = `Which word is a${q.relation === 'antonym' ? 'n' : ''} ${q.relation.toUpperCase()} of this word?`;
  promptEl.textContent = q.item.word;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectRelationAnswer(opt, btn));
    choicesEl.appendChild(btn);
  });
}
function selectRelationAnswer(opt, btnEl) {
  const q = quizQuestions[quizIndex];
  const correct = opt.toLowerCase() === q.correct.toLowerCase();
  finishChoiceQuestion(correct, btnEl, b => b.textContent.toLowerCase() === q.correct.toLowerCase());
}

function finishChoiceQuestion(correct, btnEl, isCorrectPredicate) {
  const q = quizQuestions[quizIndex];
  const buttons = document.querySelectorAll('#quizChoices .choice-btn');
  buttons.forEach(b => { b.disabled = true; });
  if (correct) {
    quizScore++;
    btnEl.classList.add('correct');
  } else {
    btnEl.classList.add('incorrect');
    buttons.forEach(b => { if (isCorrectPredicate(b)) b.classList.add('correct'); });
    quizMissed.push(q.item);
  }
  document.getElementById('qScore').textContent = quizScore;
  document.getElementById('nextQuestionBtn').style.display = 'inline-block';
}

// ---- Typed recall & cloze typing (writing modes) ----
function renderTypedRecall(q, promptEl, labelEl, choicesEl) {
  labelEl.textContent = 'Type the word for this meaning:';
  promptEl.textContent = maskedMeaning(q.item);
  promptEl.classList.add('small');
  buildTextAnswerUI(choicesEl, (typed) => normalizeAnswer(typed) === normalizeAnswer(q.item.word), q.item.word);
}
function renderCloze(q, promptEl, labelEl, choicesEl) {
  labelEl.textContent = 'Type the missing word:';
  promptEl.textContent = '';
  promptEl.classList.add('small');
  const contextEl = document.createElement('div');
  contextEl.className = 'cloze-context';
  contextEl.textContent = maskedMeaning(q.item);
  promptEl.appendChild(contextEl);
  const sentenceEl = document.createElement('div');
  sentenceEl.className = 'cloze-sentence';
  sentenceEl.textContent = q.item.cloze;
  promptEl.appendChild(sentenceEl);
  const forms = inflections(q.item.word);
  buildTextAnswerUI(choicesEl, (typed) => forms.has(normalizeAnswer(typed)), q.item.word);
}
function buildTextAnswerUI(container, isCorrectFn, correctAnswerDisplay) {
  const row = document.createElement('div');
  row.className = 'text-answer-row';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'text-input';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = 'Type your answer…';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'primary-btn';
  submitBtn.textContent = 'Submit';
  row.appendChild(input);
  row.appendChild(submitBtn);
  container.appendChild(row);
  const feedback = document.createElement('div');
  feedback.className = 'answer-feedback';
  container.appendChild(feedback);

  function submit() {
    if (input.disabled) return;
    const typed = input.value;
    const correct = typed.trim() !== '' && isCorrectFn(typed);
    input.disabled = true;
    submitBtn.disabled = true;
    input.classList.add(correct ? 'correct' : 'incorrect');
    const q = quizQuestions[quizIndex];
    if (correct) {
      quizScore++;
      feedback.textContent = 'Correct!';
      feedback.className = 'answer-feedback correct';
    } else {
      quizMissed.push(q.item);
      feedback.textContent = `Correct answer: ${correctAnswerDisplay}`;
      feedback.className = 'answer-feedback incorrect';
    }
    document.getElementById('qScore').textContent = quizScore;
    document.getElementById('nextQuestionBtn').style.display = 'inline-block';
  }
  submitBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  setTimeout(() => input.focus(), 0);
}

// ---- Hangman ----
const ALPHABET = 'abcdefghijklmnopqrstuvwxyz'.split('');
function renderHangman(q, promptEl, labelEl, choicesEl) {
  const word = q.item.word.toLowerCase();
  hangmanState = { guessed: new Set(), wrong: 0, maxWrong: 6, done: false };
  labelEl.textContent = 'Guess the word from its meaning:';
  promptEl.textContent = '';

  const meaningEl = document.createElement('div');
  meaningEl.className = 'hangman-meaning';
  meaningEl.textContent = maskedMeaning(q.item);
  choicesEl.appendChild(meaningEl);

  const blanksEl = document.createElement('div');
  blanksEl.className = 'hangman-word';
  choicesEl.appendChild(blanksEl);

  const missesEl = document.createElement('div');
  missesEl.className = 'hangman-misses';
  choicesEl.appendChild(missesEl);

  const keyboardEl = document.createElement('div');
  keyboardEl.className = 'keyboard';
  choicesEl.appendChild(keyboardEl);

  function renderBlanks() {
    blanksEl.textContent = word.split('').map(ch => {
      if (!/[a-z]/.test(ch)) return ch;
      return hangmanState.guessed.has(ch) ? ch.toUpperCase() : '_';
    }).join(' ');
  }
  function renderMisses() {
    missesEl.textContent = `Misses: ${hangmanState.wrong} / ${hangmanState.maxWrong}`;
  }
  function finish(won) {
    hangmanState.done = true;
    blanksEl.textContent = word.toUpperCase();
    keyboardEl.querySelectorAll('.key-btn').forEach(b => { b.disabled = true; });
    const qNow = quizQuestions[quizIndex];
    if (won) {
      quizScore++;
      missesEl.textContent = 'Solved it!';
      missesEl.style.color = 'var(--good)';
    } else {
      quizMissed.push(qNow.item);
      missesEl.textContent = `Out of guesses. The word was "${qNow.item.word}".`;
      missesEl.style.color = 'var(--bad)';
    }
    document.getElementById('qScore').textContent = quizScore;
    document.getElementById('nextQuestionBtn').style.display = 'inline-block';
  }
  function guess(letter, btn) {
    if (hangmanState.done || hangmanState.guessed.has(letter)) return;
    hangmanState.guessed.add(letter);
    if (word.includes(letter)) {
      btn.classList.add('correct-key');
      btn.disabled = true;
      renderBlanks();
      const solved = word.split('').every(ch => !/[a-z]/.test(ch) || hangmanState.guessed.has(ch));
      if (solved) finish(true);
    } else {
      btn.classList.add('wrong-key');
      btn.disabled = true;
      hangmanState.wrong++;
      renderMisses();
      if (hangmanState.wrong >= hangmanState.maxWrong) finish(false);
    }
  }

  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'key-btn';
    btn.textContent = letter.toUpperCase();
    btn.addEventListener('click', () => guess(letter, btn));
    keyboardEl.appendChild(btn);
  });

  renderBlanks();
  renderMisses();
}
document.addEventListener('keydown', (e) => {
  if (quizMode !== 'hangman' || !hangmanState || hangmanState.done) return;
  if (document.getElementById('quizRun').style.display === 'none') return;
  const letter = e.key.toLowerCase();
  if (letter.length === 1 && ALPHABET.includes(letter)) {
    const btn = Array.from(document.querySelectorAll('#quizChoices .key-btn')).find(b => b.textContent.toLowerCase() === letter);
    if (btn && !btn.disabled) btn.click();
  }
});

document.getElementById('nextQuestionBtn').addEventListener('click', () => {
  quizIndex++;
  if (quizIndex >= quizQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
});

document.getElementById('quitQuizBtn').addEventListener('click', showResults);

function showResults() {
  document.getElementById('quizRun').style.display = 'none';
  document.getElementById('quizResults').style.display = 'block';
  const answered = quizScore + quizMissed.length;
  document.getElementById('finalScore').textContent = quizScore;
  document.getElementById('finalTotal').textContent = answered;

  const missedEl = document.getElementById('missedList');
  if (quizMissed.length === 0) {
    missedEl.innerHTML = '<p style="color: var(--good); margin-top: 14px;">Perfect score, nice work.</p>';
  } else {
    missedEl.innerHTML = '<div class="results-list">' + quizMissed.map(w =>
      `<div class="results-row wrong"><span class="rw">${escapeHtml(w.word)}</span><span class="rm">${escapeHtml(w.meaning)}</span></div>`
    ).join('') + '</div>';
  }
}

document.getElementById('restartQuizBtn').addEventListener('click', () => {
  document.getElementById('quizResults').style.display = 'none';
  document.getElementById('quizSetup').style.display = 'block';
});

loadWords();
</script>
